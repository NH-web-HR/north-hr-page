<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>North — Entrance</title>
  <meta name="theme-color" content="#82bdcc" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/index.css" />
  <link rel="preload" href="./fonts/ArgonR.otf" as="font" type="font/otf" crossorigin>
</head>
<body>
  <!-- 粒子背景 -->
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <!-- 追光層 -->
  <div id="spotlight" aria-hidden="true"></div>

  <!-- 主舞台 -->
  <main class="stage">
    <!-- LOGO + 霓虹環 -->
    <div class="logo-wrap">

      <img src="./icon/northlogo.png" alt="諾思資訊 North" class="logo" />
    </div>

    <!-- 標語 -->
    <h1 class="brand glitch" data-text="north co.">north co.</h1>
    <p class="tagline">諾思資訊｜專業・熱誠・國際視野・永續發展</p>

    <!-- 進入按鈕 -->
    <button id="enterBtn" class="enter neon" aria-label="Enter north">
      <span>Enter North</span>
      <svg class="arrow" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M5 12h12m0 0l-5-5m5 5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- 提示 -->
    <div class="hint">按下 Enter 鍵或點擊按鈕進入</div>
  </main>

  <!-- 角落資訊 -->
  <footer class="corner">
    <span>© <span id="year"></span> 諾思資訊股份有限公司</span>
  </footer>

  <!-- 遮幕（轉場） -->
  <div id="veil" class="veil" aria-hidden="true"></div>

  <script src="./js/index.js"></script>
</body>
</html>
